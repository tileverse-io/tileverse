site_name: Tileverse Documentation
site_description: Java libraries for cloud-optimized geospatial data access
site_author: Multiversio LLC
copyright: "&copy; 2025 Multiversio LLC. All rights reserved."
repo_url: https://github.com/tileverse-io/tileverse
edit_uri: edit/main/docs/src/
site_url: https://tileverse.io/
docs_dir: src

theme:
  name: material
  logo: assets/images/tileverse-logo.svg
  favicon: assets/images/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/logo-link.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - redirects:
      # Pages merged into others keep their old URLs working
      redirect_maps:
        pmtiles/tutorial.md: pmtiles/how-to/read-pmtiles.md
        pmtiles/how-to/cloud-storage.md: pmtiles/how-to/read-pmtiles.md
        vectortiles/tutorial.md: vectortiles/index.md
        storage/how-to/install.md: getting-started.md
        storage/reference/rangereader.md: storage/how-to/read-byte-ranges.md
        storage/reference/rangereader-quick-start.md: storage/how-to/read-byte-ranges.md
        storage/reference/rangereader-recipes.md: storage/how-to/read-byte-ranges.md
        storage/explanation/performance.md: storage/explanation/internals.md
        developer-guide/how-to/test.md: developer-guide/how-to/build.md
        developer-guide/explanation/system-design.md: developer-guide/explanation/architecture.md
        developer-guide/explanation/dependencies.md: developer-guide/explanation/architecture.md
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Storage:
    - Overview: storage/index.md
    - How-to guides:
      - Use each backend: storage/how-to/use-each-backend.md
      - Read byte ranges: storage/how-to/read-byte-ranges.md
      - Configure for performance: storage/how-to/configure.md
      - Authenticate: storage/how-to/authenticate.md
      - Troubleshoot: storage/how-to/troubleshoot.md
      - Migrate from 2.0: storage/how-to/migrate-from-2.0.md
      - Migrate from 1.4.x: storage/how-to/migrate-from-1.4.md
    - Explanation:
      - Why tileverse-storage?: storage/explanation/why.md
      - How it works: storage/explanation/internals.md
  - PMTiles:
    - Overview: pmtiles/index.md
    - How-to guides:
      - Read PMTiles: pmtiles/how-to/read-pmtiles.md
    - Reference:
      - Tile Stores: pmtiles/reference/tile-stores.md
  - Versatiles:
    - Overview: versatiles/index.md
    - How-to guides:
      - Read Versatiles: versatiles/how-to/read-versatiles.md
    - Reference:
      - Format support: versatiles/reference/format-support.md
  - Vector Tiles:
    - Overview: vectortiles/index.md
    - How-to guides:
      - Encode vector tiles: vectortiles/how-to/encode.md
      - Decode vector tiles: vectortiles/how-to/decode.md
  - Tile Matrix Set:
    - Overview: tilematrixset/index.md
    - Tutorial: tilematrixset/tutorial.md
    - How-to guides:
      - Tile pyramids and ranges: tilematrixset/how-to/tile-pyramids.md
      - Standard tile matrix sets: tilematrixset/how-to/standard-sets.md
    - Reference:
      - OGC compliance and encodings: tilematrixset/reference/ogc-compliance.md
  - Developer Guide:
    - Overview: developer-guide/index.md
    - AI policy: ai.md
    - How-to guides:
      - Build and test: developer-guide/how-to/build.md
      - Contribute: developer-guide/how-to/contribute.md
    - Explanation:
      - Architecture: developer-guide/explanation/architecture.md

extra:
  analytics:
    provider: google
    property: G-510Y1KN03V
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tileverse-io/tileverse
    - icon: fontawesome/solid/globe
      link: https://tileverse.io